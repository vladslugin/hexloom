name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows · C++
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The Visual Studio generator finds MSVC without a developer shell, and
      # both CMake and MSVC ship on the runner image.
      - name: Configure
        run: >
          cmake -B build/windows -G "Visual Studio 17 2022" -A x64
          -DHEXLOOM_BUILD_TESTS=ON
          -DHEXLOOM_BUILD_GODOT_ADAPTER=ON

      - name: Build
        run: cmake --build build/windows --config Debug

      # Godot is not installed here, so the two Godot smoke tests do not
      # register. This job covers the C++ core, the CLI, and the Windows
      # process supervisor.
      - name: Test
        run: ctest --test-dir build/windows -C Debug --output-on-failure

      - name: Validate example specification
        run: >
          build/windows/apps/cli/Debug/hexloom.exe
          validate games/material-lab/game.yaml

  build-and-test:
    name: Linux · C++ · Godot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build unzip

      - name: Install Godot 4.7.1
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            /usr/local/bin/godot
          godot --version

      - name: Configure
        run: cmake --preset desktop-debug

      - name: Build
        run: cmake --build --preset desktop-debug

      - name: Test
        run: ctest --preset desktop-debug

      - name: Validate example specification
        run: |
          ./build/desktop-debug/apps/cli/hexloom \
            validate \
            games/material-lab/game.yaml
