# Durable decisions about this world. Hexloom prepends these to every agent
# prompt so style, mechanics, and constraints do not have to be restated each
# session. A locked entry may not be traded away to satisfy a new request.
memory:
  - id: cold_stone_palette
    category: visual_style
    text: >-
      Stone reads cold and desaturated; firelight is the only warm source in
      the world.
    locked: true
  - id: broad_silhouettes
    category: visual_style
    text: Favor broad readable silhouettes over fine surface detail.

  - id: shrine_traversable
    category: mechanics
    text: Every shrine stays traversable from all four approaches.
    locked: true

  - id: mobile_triangle_budget
    category: constraint
    text: Scenes stay under 18k triangles so mobile parity is never in doubt.
    locked: true
  - id: no_photoreal_materials
    category: constraint
    text: Materials stay stylized; photoreal surfaces break the art direction.
    locked: true

  - id: deterministic_textures_first
    category: decision
    text: >-
      Textures come from the deterministic provider until an image provider has
      been audited for reproducibility.
  - id: godot_is_an_adapter
    category: decision
    text: >-
      Game rules live in the C++ core; Godot is the first runtime adapter, not
      the source of truth.
